[project]
name = "yappr"
version = "0.1.0"
description = "Find out what your site's been yappin' about to AI."
readme = "README.md"
authors = [
    { name = "mkandil", email = "mohanadmkandil@gmail.com" },
]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "seo", "geo", "aeo", "peec", "audit", "visibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
yappr = "yappr.cli:app"

[project.urls]
Homepage = "https://github.com/mohanadkandil/yappr"
Issues = "https://github.com/mohanadkandil/yappr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
